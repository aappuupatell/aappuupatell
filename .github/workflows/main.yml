name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write

    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: aappuupatell
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          config_timezone: America/Chicago
          config_octicon: yes

      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: aappuupatell
          base: ""
          config_timezone: America/Chicago

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Stock
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.stock.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: aappuupatell
          base: ""
          config_timezone: America/Chicago

          plugin_stock: yes
          plugin_stock_token: ${{ secrets.STOCK_TOKEN }}
          plugin_stock_symbol: SPY
          plugin_stock_duration: 1mo
          plugin_stock_interval: 15m
